services:
  frontend:
    container_name: frontend
    image: nginx
    ports :
      - "8080:80"
    volumes :
    - ./frontend/index.html:/usr/share/nginx/html/index.html
    - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
    -  backend

  backend:
    container_name: backend
    build: ./backend
    depends_on:
      - database

  database:
    container_name: database
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root123