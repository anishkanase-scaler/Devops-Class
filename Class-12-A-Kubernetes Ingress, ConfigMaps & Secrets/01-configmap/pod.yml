apiVersion: v1
kind: Pod
metadata:
  name: yatri-configmap-pod
spec:
  containers:
    - name: config-reader
      image: busybox:1.36
      command: ["sh", "-c", "sleep 3600"]
      envFrom:
        - configMapRef:
            name: yatri-app-config

# The key part is envFrom. It tells Kubernetes to take all key-value pairs from yatri-app-config and expose them as environment variables inside the container. For example, ENVIRONMENT becomes an environment variable with value production, and PORT becomes 5000.