apiVersion: apps/v1
kind: Deployment
metadata:
  name: yatri-ingress-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: yatri-ingress-app
  template:
    metadata:
      labels:
        app: yatri-ingress-app
    spec:
      containers:
        - name: nginx
          image: nginx:alpine
          ports:
            - containerPort: 80
          command: ["/bin/sh", "-c"]
          args:
            - echo '<h1>Yatri Ingress App</h1><p>Ingress routing works</p>' > /usr/share/nginx/html/index.html && exec nginx -g 'daemon off;'