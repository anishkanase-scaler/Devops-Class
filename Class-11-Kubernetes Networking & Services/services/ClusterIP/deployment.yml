apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-app-clusterip
  labels:
    app: web-clusterip
#  This label is for deployment itself, for us humans to identify this deployment. 
spec:
  replicas: 3
  selector:
    matchLabels: 
      app: web-clusterip
  template:
    metadata:
      labels:
        app: web-clusterip
    spec: 
      containers:
        - name: nginx-web
          image: nginx:1.25-alpine
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "100m"
              memory: "128Mi"     



# What this spec does: While the upper spec (under the Deployment kind) tells the manager how many pods to run (replicas: 3), this nested spec tells the manager what goes inside those pods. It dictates that every new pod must run the Nginx container, open port 80, and be restricted to a maximum of 128Mi of memory.

# Now whwenever, any pods go down, the dpeloyment will create new pods, and those new pods will follow the lower spec template. 