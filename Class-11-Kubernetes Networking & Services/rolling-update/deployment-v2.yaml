apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-rolling
  labels: 
    # This label is of Deployment itself and not for Pods. 
    app: app-rolling
    version: "v2"
spec:
  replicas: 3
  # RollingUpdate: Kubernetes replaces old pods one-by-one while keeping the service up.
  # maxSurge: 1     -> Allows 1 extra pod above the desired count during the update.
  # maxUnavailable: 0 -> Zero pods can be unavailable at any point. Zero downtime guaranteed.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: app-rolling
  template:
    metadata:
      labels:
        app: app-rolling
        version: "v2"
    spec:
      containers:
        - name: backend
          image: python:3.11-alpine3.19
          command: ["python3", "-c", "import http.server; print('Backend v2.0.0 listening on 5000'); http.server.test(HandlerClass=http.server.SimpleHTTPRequestHandler, port=5000)"]
          ports:
            - containerPort: 5000
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "250m"
              memory: "256Mi"




